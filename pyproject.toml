[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "k-univ-mcp"
version = "0.1.0"
description = "MCP server and CLI for Korean university course catalog data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0.0",
  "openpyxl>=3.1.0",
  "pandas>=2.2.0",
  "playwright>=1.52.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.0",
  "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
  "basedpyright>=1.31.0",
  "pytest>=8.2.0",
]

[project.scripts]
k-univ-mcp = "k_univ_mcp.cli:main"
k-univ-mcp-server = "k_univ_mcp.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
k_univ_mcp = ["providers/yonsei/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
